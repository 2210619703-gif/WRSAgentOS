[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrs-agent"
version = "0.1.0"
description = "Interruptible robot runtime with explicit execution authority"
requires-python = ">=3.12,<3.13"
dependencies = ["eclipse-zenoh==1.9.0", "pydantic>=2.12,<3"]

[project.optional-dependencies]
# One HTTP client for every model protocol; dotenv is used by the model examples.
llm = ["httpx>=0.28,<0.29", "python-dotenv>=1.1,<2"]
camera = ["numpy>=1.26,<3", "pillow>=12,<13", "opencv-python>=4.10,<6"]
realsense = ["pyrealsense2==2.56.5.9235"]
yolo = ["ultralytics>=8.3,<9"]
fastsam = ["ultralytics>=8.3,<9",
           "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6"]
sam3 = ["transformers==5.15.1", "torch==2.9.0", "torchvision==0.24.0",
        "numpy>=1.26,<3", "pillow>=12,<13"]
graspnet = ["torch==2.9.0", "numpy>=1.26,<3", "pillow>=12,<13", "scipy>=1.14,<2",
            "ninja>=1.11,<2",
            "setuptools>=68", "wheel>=0.45,<1"]
# qwen-tts-hf 0.1.1.post1 (2026-08-25) predates Transformers 5.16; on 5.17 its rope
# compatibility shim raises AttributeError on the Mimi codec config during weight init.
qwen-tts = [
    "faster-qwen3-tts==0.4.0", "transformers==5.15.1",
    "torch==2.9.0", "torchaudio==2.9.0", "sounddevice>=0.5,<0.6",
]
qwen-asr = ["qwen-asr==0.0.6", "torch==2.9.0", "torchaudio==2.9.0", "sounddevice>=0.5,<0.6"]

[dependency-groups]
dev = ["httpx>=0.28,<0.29", "python-dotenv>=1.1,<2",
       "pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1",
       "numpy>=1.26,<3", "pillow>=12,<13", "opencv-python>=4.10,<6"]

[tool.setuptools.packages.find]
include = ["wrs_agent*"]

[tool.setuptools.package-data]
"wrs_agent.drivers.cameras" = ["LICENSE.legacy-wrs"]
"wrs_agent.nodes.camera" = ["panel.js", "scene.js"]
"wrs_agent.nodes.asr" = ["assets.json"]
"wrs_agent.nodes.tts" = ["assets.json"]
"wrs_agent.nodes.ui" = ["static/*"]
"wrs_agent.nodes.segmentation" = ["assets.json", "fastsam_assets.json", "clip_assets.json"]
"wrs_agent.nodes.vision" = ["assets.json"]
"wrs_agent.nodes.grasp" = ["assets.json"]
"wrs_agent.skills" = ["README.md", "*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = ["zenoh: real multi-process Zenoh", "wrs: WRS virtual model", "live_model: paid model opt-in", "audio_live: real microphone", "hardware: supervised hardware only"]
norecursedirs = ["third_party", ".local", ".references"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party", ".local", ".references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"wrs_agent/transport.py" = ["ASYNC109"]
"tests/conftest.py" = ["ASYNC109"]

# The upstream speech packages pin incompatible Transformers versions.
# Install these extras into separate environments; nodes already communicate over Zenoh.
[tool.uv]
conflicts = [
    [{ extra = "qwen-tts" }, { extra = "qwen-asr" }],
    [{ extra = "sam3" }, { extra = "qwen-asr" }],
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
