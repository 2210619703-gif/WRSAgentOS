# 默认厨具摆放：05 每次启动从此文件生成新副本；16 编辑器只改本次副本。
# pos = [X, Y, Z]，单位：米。0.01 米 = 1 厘米。
# 世界坐标：+X 为机械臂前方，+Y 为左侧，-Y 为右侧，+Z 为上方。
# rpy_deg = [绕X轴, 绕Y轴, 绕Z轴]，单位：度；平放转向通常只改第三个值。
# 正方向按右手定则；绕 +Z 的正转，从上往下看是逆时针。
# 组合规则：R = Rz(yaw) * Ry(pitch) * Rx(roll)，相对于父物体坐标系。
# 没写 parent：pos/rpy_deg 相对世界坐标；写了 parent：相对该物体。
# 移动或旋转父物体，其子物体会整体跟随。parent 不表示物理接触或真实抓取。
# 临时修改后刷新 07 的 8000 页面可查看；重启 05 恢复本文件中的默认值。
# 原有 STL 的尺寸、颜色、透明度仍在同目录 scene.toml 中。

